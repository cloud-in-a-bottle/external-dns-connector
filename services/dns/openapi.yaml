openapi: 3.0.3
info:
  title: OpenHost DNS Service
  version: 0.1.0
  description: |
    Read and write DNS records at whatever external provider the space owner has configured, without
    the calling app ever seeing registrar credentials.

    **Service URL:** `github.com/cloud-in-a-bottle/external-dns-connector/services/dns`

    All requests are proxied through the OpenHost router, which injects `X-OpenHost-Consumer-Id` and
    an `X-OpenHost-Permissions` array. The provider enforces those grants; the router does not.

    ## Permission grants

    An ACME consumer commonly needs two grants to cover both the zone apex challenge and challenges
    below it:

    ```json
    [
      {"name": "_acme-challenge", "type": "TXT", "access": "rw"},
      {"name": "_acme-challenge.**", "type": "TXT", "access": "rw"}
    ]
    ```

    * `name` — matched against the **zone-relative** record name (`@` is the zone apex). `**` is the
      only metacharacter and matches any run of characters, including none. A single `*` is
      **literal**: it is a real DNS wildcard label, so `*.app` grants exactly that record.
    * `type` — a case-insensitive RR type token, or `**` for any type.
    * `access` — `r` for read, `rw` for read and write. `rw` always includes read.

    Grants say nothing about zones: they apply to matching records in every configured zone. Provider
    bindings and changes to the configured zone set are owner-only. A caller with at least one valid,
    nonempty DNS grant can list every configured zone name through `/zones`; a caller without one
    receives an empty list.

    "Read all" is `{"name": "**", "type": "**", "access": "r"}`; "write all" is the same with `rw`.

    Only `scope: "global"` grants are honored — declare them in your manifest and the owner approves
    them at install time:

    ```toml
    [[services.v2.consumes]]
    service   = "github.com/cloud-in-a-bottle/external-dns-connector/services/dns"
    shortname = "dns"
    version   = ">=0.1.0"
    grants    = [
      {name = "_acme-challenge", type = "TXT", access = "rw"},
      {name = "_acme-challenge.**", type = "TXT", access = "rw"},
    ]
    ```

    ## Records

    One flat shape covers every type, mirroring a zone file line:

    ```json
    {"name": "www", "type": "A", "ttl": 300, "data": "192.0.2.1"}
    ```

    `name` is relative to the zone — `www`, not `www.example.com`; a name that already includes the
    zone is rejected rather than silently written as `www.example.com.example.com`. Set and append
    require an integer `ttl` from 60 through 2147483647 seconds. `data` is unescaped zone-file RDATA,
    so `MX` is `"10 mail.example.com."` and `SRV` is `"10 5 443 host.example.com."`.

    Writable types are `A`, `AAAA`, `CAA`, `CNAME`, `MX`, `NS`, `SRV`, and `TXT`. Reads return
    whatever the provider reports, including types outside that list.

    Set and append permit at most 50 distinct values in one `(name, type)` RRset. Existing values
    count toward that limit for append.

    ## Zones

    Reads default to every configured zone. **Writes must name one**: either an exact zone from
    `/zones`, or `"*"` to apply the change to all of them. Omitting it is a `zone_required` error
    rather than a silent fan-out.

paths:
  /zones:
    post:
      summary: List the zones this connector manages
      description: |
        A caller with at least one valid, nonempty DNS grant receives every configured zone. A caller
        without one receives an empty list, so the response does not reveal which domains the owner
        runs or request an unnecessarily broad grant.
      responses:
        "200":
          description: The configured zones.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [zones]
                properties:
                  zones:
                    type: array
                    items: {type: string}
                    example: ["example.com", "other.org"]
        "403":
          $ref: "#/components/responses/Forbidden"
        "500": {$ref: "#/components/responses/InternalError"}

  /records/get:
    post:
      summary: Read records
      description: |
        Returns only the records the caller's grants match; everything else is omitted rather than
        refused, so a narrowly-scoped app sees a zone containing just its own records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                zone:
                  type: string
                  description: A configured zone, or `*`. Defaults to every zone.
                name:
                  type: string
                  description: Optional exact zone-relative name filter.
                type:
                  type: string
                  description: Optional exact RR type filter.
      responses:
        "200": {$ref: "#/components/responses/Results"}
        "207": {$ref: "#/components/responses/Results"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/Results"}

  /records/set:
    post:
      summary: Set records (replaces the RRset)
      description: |
        For each `(name, type)` in the input, the supplied records become the only records with that
        name and type in the zone. Records with other names or types are untouched.

        Every record is authorized before any provider is contacted, so a batch containing one
        record the caller may not write applies none of them.
      requestBody: {$ref: "#/components/requestBodies/Write"}
      responses:
        "200": {$ref: "#/components/responses/Results"}
        "207": {$ref: "#/components/responses/Results"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/Results"}

  /records/append:
    post:
      summary: Add records without replacing existing ones
      requestBody: {$ref: "#/components/requestBodies/Write"}
      responses:
        "200": {$ref: "#/components/responses/Results"}
        "207": {$ref: "#/components/responses/Results"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/Results"}

  /records/delete:
    post:
      summary: Delete records, or clear a whole RRset
      description: |
        A record given **with** nonblank `data` deletes the record matching `(name, type, data)`.
        `ttl` never participates in exact matching because DNS stores one TTL for the whole RRset,
        not one per value. A record given **without** `data` clears the whole `(name, type)` RRset,
        removing whatever it currently holds. `ttl` may be omitted in either form, but if present it
        must be a non-null integer from 60 through 2147483647. Explicitly blank or null `data` is
        invalid.

        The second form is what an unconditional cleanup path needs: a process that died before
        recording the value it wrote cannot delete by exact value. Clearing a name that holds nothing
        succeeds and reports nothing deleted, so the call is safe to make unconditionally.

        Grants are checked the same way either way — on `(name, type)`.

        Records that do not exist are silently ignored, per libdns semantics.
      requestBody: {$ref: "#/components/requestBodies/Delete"}
      responses:
        "200": {$ref: "#/components/responses/Results"}
        "207": {$ref: "#/components/responses/Results"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/Results"}

components:
  requestBodies:
    Delete:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [zone, records]
            properties:
              zone:
                type: string
                description: A configured zone, or `*` for all of them. Required.
                example: example.com
              records:
                type: array
                minItems: 1
                items: {$ref: "#/components/schemas/DeleteTarget"}
          examples:
            exact:
              summary: Delete one specific record
              value:
                zone: example.com
                records: [{name: _acme-challenge, type: TXT, data: "the-token"}]
            clearRRset:
              summary: Clear the whole RRset, whatever it holds
              value:
                zone: example.com
                records: [{name: _acme-challenge, type: TXT}]

    Write:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [zone, records]
            properties:
              zone:
                type: string
                description: A configured zone, or `*` for all of them. Required.
                example: example.com
              records:
                type: array
                minItems: 1
                description: |
                  Each `(name, type)` RRset may contain at most 50 distinct values after the
                  operation. Existing values count toward the limit for append.
                items: {$ref: "#/components/schemas/WriteRecord"}

  responses:
    Results:
      description: |
        Per-zone outcomes. The status reflects the whole: `200` when every zone succeeded, `207` when
        some did, `502` when none did — so a total provider outage is never reported as success.

        Provider APIs are not transactionally atomic across RRsets. If a later RRset fails, a failed
        zone result may contain records successfully applied before the reported error. If Set
        replaced values but its TTL change failed, those records carry the prior effective TTL and
        are omitted when that TTL is unknown.
      content:
        application/json:
          schema:
            type: object
            required: [ok, results]
            properties:
              ok:
                type: boolean
                description: True only if every zone succeeded.
              results:
                type: array
                items:
                  type: object
                  required: [zone, ok]
                  properties:
                    zone: {type: string}
                    ok: {type: boolean}
                    records:
                      type: array
                      description: |
                        Records read or successfully mutated. On a failed multi-RRset mutation, this
                        may contain records applied before a later RRset failed.
                      items: {$ref: "#/components/schemas/ReadRecord"}
                    error: {type: string}

    Error:
      description: |
        The request was rejected. `error` is one of `invalid_request`, `invalid_record`,
        `zone_required`, `unknown_zone`, or `no_zones_configured`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

    Forbidden:
      description: |
        Either the caller has no grant covering a record it tried to touch, or the route was reached
        without a service consumer identity. A `permission_required` response includes the grant that
        would permit the operation; `not_a_service_call` does not include `required_grant`.
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: "#/components/schemas/PermissionRequiredError"}
              - {$ref: "#/components/schemas/NotAServiceCallError"}

    InternalError:
      description: An unexpected storage or configuration lookup failed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/InternalError"}

  schemas:
    WriteRecord:
      type: object
      additionalProperties: false
      required: [name, type, ttl, data]
      properties:
        name:
          type: string
          description: Zone-relative name; `@` for the apex.
          example: www
        type:
          type: string
          enum: [A, AAAA, CAA, CNAME, MX, NS, SRV, TXT]
        ttl:
          type: integer
          format: int64
          minimum: 60
          maximum: 2147483647
          description: Seconds, from Hetzner's minimum through its signed 32-bit maximum.
          example: 300
        data:
          type: string
          pattern: '\S'
          description: Unescaped zone-file RDATA.
          example: 192.0.2.1

    ReadRecord:
      type: object
      required: [name, type, ttl, data]
      properties:
        name:
          type: string
          description: Zone-relative name; `@` for the apex.
          example: www
        type:
          type: string
          description: |
            Any RR type returned by the provider, including types this service cannot write.
          example: SOA
        ttl:
          type: integer
          description: Seconds.
          example: 300
        data:
          type: string
          description: Unescaped zone-file RDATA.

    DeleteTarget:
      type: object
      additionalProperties: false
      required: [name, type]
      description: |
        A record to remove. With nonblank `data`, the record matching `(name, type, data)` is deleted.
        Without `data`, the whole `(name, type)` RRset is cleared. `ttl` is ignored in both forms.
      properties:
        name:
          type: string
          description: Zone-relative name; `@` for the apex.
          example: _acme-challenge
        type:
          type: string
          enum: [A, AAAA, CAA, CNAME, MX, NS, SRV, TXT]
        ttl:
          type: integer
          format: int64
          minimum: 60
          maximum: 2147483647
          description: Optional and ignored for deletion, but validated when present.
        data:
          type: string
          pattern: '\S'
          description: Omit to clear the whole RRset. Blank and null values are invalid.

    PermissionRequiredError:
      type: object
      required: [error, message, required_grant]
      properties:
        error: {type: string, enum: [permission_required]}
        message: {type: string}
        required_grant:
          type: object
          required: [grant, scope]
          properties:
            grant: {$ref: "#/components/schemas/Grant"}
            scope: {type: string, enum: [global]}
            grant_url:
              type: string
              format: uri
              description: Owner approval URL added by the OpenHost router when it proxies the response.

    NotAServiceCallError:
      type: object
      required: [error, message]
      properties:
        error: {type: string, enum: [not_a_service_call]}
        message: {type: string}

    InternalError:
      type: object
      required: [error, message]
      properties:
        error: {type: string, enum: [internal_error]}
        message: {type: string}

    Grant:
      type: object
      additionalProperties: false
      required: [name, type, access]
      properties:
        name:
          type: string
          description: Name pattern; `**` matches any run of characters, `*` is a literal label.
          example: _acme-challenge.**
        type:
          type: string
          pattern: '^(?:\*\*|[A-Za-z][A-Za-z0-9]*)$'
          description: Case-insensitive RR type token, or `**` for any.
          example: TXT
        access:
          type: string
          enum: [r, rw]

    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        message: {type: string}
