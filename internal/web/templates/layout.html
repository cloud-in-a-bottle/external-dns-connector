{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · DNS Connector</title>
  <style>
    :root {
      --bg: #11131a; --panel: #191c26; --line: #2b3040; --ink: #e6e8ef;
      --dim: #8a90a6; --accent: #7aa2f7; --ok: #7bd88f; --bad: #f7768e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      border-bottom: 1px solid var(--line); padding: 0 24px;
      display: flex; align-items: center; gap: 28px; background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; padding: 16px 0; letter-spacing: .01em; }
    header nav { display: flex; gap: 20px; }
    header nav a { color: var(--dim); text-decoration: none; padding: 16px 0; font-size: 14px; }
    header nav a:hover, header nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
    main { max-width: 980px; margin: 0 auto; padding: 28px 24px 64px; }
    h2 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
    h3 { font-size: 15px; margin: 28px 0 10px; font-weight: 600; }
    p.sub { color: var(--dim); margin: 0 0 22px; font-size: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px;
         text-transform: uppercase; letter-spacing: .06em; padding: 0 10px 8px; }
    td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
    td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    input, select, button {
      font: inherit; background: #0d0f16; color: var(--ink);
      border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { background: var(--accent); color: #0d0f16; border: 0; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 400; }
    button.ghost:hover { color: var(--bad); border-color: var(--bad); }
    label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 5px; }
    .field { margin-bottom: 14px; }
    .field input, .field select { width: 100%; }
    .field .help { font-size: 12px; color: var(--dim); margin-top: 4px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .row > * { flex: 1 1 150px; }
    .row > .narrow { flex: 0 0 110px; }
    .flash { border-radius: 8px; padding: 11px 14px; margin-bottom: 18px; font-size: 14px; }
    .flash.ok { background: #16281c; border: 1px solid #2e5c3c; color: var(--ok); }
    .flash.bad { background: #2a1620; border: 1px solid #5c2e3c; color: var(--bad); }
    .empty { color: var(--dim); font-size: 14px; padding: 10px 0; }
    .tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
    a { color: var(--accent); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
           background: #0d0f16; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>DNS Connector</h1>
    <nav>
      <a href="/" class="{{if eq .Nav "home"}}on{{end}}">Zones</a>
      <a href="/accounts" class="{{if eq .Nav "accounts"}}on{{end}}">Providers</a>
      <a href="/audit" class="{{if eq .Nav "audit"}}on{{end}}">Activity</a>
    </nav>
  </header>
  <main>
    {{if .Flash}}<div class="flash {{.FlashKind}}">{{.Flash}}</div>{{end}}
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
